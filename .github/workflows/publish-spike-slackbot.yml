name: Publish Spike Slackbot

on:
  pull_request:
    paths:
      - .github/workflows/publish-spike-slackbot.yml
      - services/slackbotv2/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-spike-slackbot-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  build-multiarch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable multi-architecture image
        env:
          IMAGE: ghcr.io/cmpx575/centaur/centaur-slackbotv2
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/cmpx575/centaur" \
            --tag "${IMAGE}:${SOURCE_SHA}" \
            --tag "${IMAGE}:spike-${SOURCE_SHA}" \
            --push \
            --file services/slackbotv2/Dockerfile \
            .
